name: Build LLDP-A

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          fi

      - name: Build Debug & Release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lldp-a-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Rename Release APK
        id: rename_apk
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          RENAMED_PATH="app/build/outputs/apk/release/lldp-a-$SHORT_SHA.apk"
          echo "apk_path=$RENAMED_PATH" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "$RENAMED_PATH"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: lldp-a-release
          path: ${{ steps.rename_apk.outputs.apk_path }}

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename_apk.outputs.apk_path }}
          tag_name: release-${{ github.sha }}
          name: LLDP-A (${{ steps.rename_apk.outputs.short_sha }})
          body: |
            Automated release for commit `${{ github.sha }}`.

            - **App**: LLDP-A (Android LLDP/CDP Sniffer)
            - **Binary**: `lldp-a-${{ steps.rename_apk.outputs.short_sha }}.apk`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
